[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# One page, and /edit is its own real file, so the catch-all only serves the homepage
# for unknown paths.
[[redirects]]
  from = "/edit"
  to = "/edit/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The editor must never be indexed or framed by another site.
[[headers]]
  for = "/edit/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
